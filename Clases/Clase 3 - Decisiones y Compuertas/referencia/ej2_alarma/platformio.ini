; Clase 3 - Ejercicio 2 (solución): alarma de una casa
; Proyecto PlatformIO - Sistemas Lógicos UNSE 2026
; Elegir la placa en la barra azul de abajo: env:esp32dev o env:esp32c3

[platformio]
default_envs = esp32dev

; ESP32 DevKit (placa de cátedra)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ESP32-C3 Super Mini (los pines se traducen en include/placa_c3.h)
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D PLACA_C3
build_src_flags =
    -include $PROJECT_INCLUDE_DIR/placa_c3.h
